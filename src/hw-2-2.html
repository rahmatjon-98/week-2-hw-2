<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="./fontawesome-free-6.7.2-web/css/all.css">
    <link rel="stylesheet" href="./hw-2-1.html">
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body class="bg-white dark:bg-black text-black dark:text-white">

    <div class="div1 bg-[#2A254B] flex justify-between items-center p-2">
        <div class="hidden lg:block"></div>
        <i class="fa-solid fa-truck-fast px-2 text-white"></i>
        <p class=" text-white text-[14px] "></i> Free delivery on all orders over £50 with code easter checkout</p>
        <i class="fa-solid fa-xmark text-white px-5"></i>
    </div>

    <script>
        const toggleButton = document.getElementById('dark-light');
        const icon = toggleButton.querySelector('i');

        if (localStorage.theme === 'dark') {
            document.documentElement.classList.add('dark');
            icon.classList.remove('fa-sun');
            icon.classList.add('fa-moon');
        } else {
            document.documentElement.classList.remove('dark');
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
        }

        toggleButton.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        });
    </script>

</body>

</html>
